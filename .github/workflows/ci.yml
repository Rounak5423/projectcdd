name: CIVORA CI Pipeline

on:
  push:
    branches: [ main, rounak ]
  pull_request:
    branches: [ main ]

jobs:
  validate-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript & Vite Production Build
        run: npm run build

  validate-backend:
    name: Backend Test Suite & Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r genesis-engine/backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Regression Test Suite
        env:
          ENVIRONMENT: test
          GENESIS_JWT_SECRET: test_ci_jwt_secret_key_minimum_32_characters_for_testing
        run: |
          cd genesis-engine/backend
          pytest tests/ -v

      - name: Verify SQLite Online Backup Utility
        run: |
          python genesis-engine/backend/db/backup.py create
