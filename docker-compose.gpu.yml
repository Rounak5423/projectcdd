# ==============================================================================
# GENESIS Civilisation Engine — Optional NVIDIA GPU Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile ml up ml
# Prerequisites: NVIDIA Driver, NVIDIA Container Toolkit (nvidia-docker2)
# ==============================================================================

services:
  ml:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
